        :root {

            --theme-body-bg: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #020617 100%);

            background: var(--theme-body-bg);

            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            transition: background 0.5s ease;

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);

            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .tarot-card {
            background: var(--theme-card-bg);
            border: 1px solid var(--theme-card-border);
            box-shadow: 0 15px 35px -10px var(--theme-card-shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tarot-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px -12px var(--theme-card-hover-shadow);
            border-color: var(--theme-card-hover-border);
        }

        .tarot-img-shadow {
            box-shadow: 0 15px 30px -5px var(--theme-img-shadow);
            transition: box-shadow 0.4s ease;
        }
        
        .tarot-icon-shadow {
            filter: drop-shadow(0 10px 15px var(--theme-img-shadow));
            transition: filter 0.4s ease;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;

                    toggleActive: 'bg-purple-600 border-purple-400',
                    btnPrimary: 'from-fuchsia-600 via-purple-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 shadow-fuchsia-900/50',
                    bgLight: 'bg-fuchsia-950/40',
                    bgBadge: 'bg-fuchsia-950 text-fuchsia-300 border-fuchsia-800/50',
                    btnAction: 'bg-fuchsia-600/30 text-fuchsia-200 hover:bg-fuchsia-600/50 border-fuchsia-500/30',
                    badgeInnate: 'bg-fuchsia-600',
                    badgeInnateBonus: 'bg-purple-600',
                    badgeAcquired: 'bg-pink-600',
                    badgeAcquiredBonus: 'bg-rose-600'
                }
            },
            monochrome: {
                cssVars: {
                    '--theme-body-bg': 'radial-gradient(circle at 50% 20%, #334155 0%, #0f172a 70%, #020617 100%)',
                    '--theme-card-bg': 'linear-gradient(135deg, rgba(71, 85, 105, 0.8) 0%, rgba(15, 23, 42, 0.9) 50%, rgba(2, 6, 23, 0.95) 100%)',
                    '--theme-card-border': 'rgba(148, 163, 184, 0.4)',
                    '--theme-card-shadow': 'rgba(148, 163, 184, 0.3)',
                    '--theme-card-hover-shadow': 'rgba(148, 163, 184, 0.5)',
                    '--theme-card-hover-border': 'rgba(203, 213, 225, 0.6)',
                    '--theme-img-shadow': 'rgba(148, 163, 184, 0.5)'
                },
                c: {
                    titleGrad: 'from-slate-300 via-gray-300 to-zinc-300',
                    tabActive: 'from-slate-600 to-gray-600 shadow-slate-900/50',
                    textMain: 'text-slate-200',
                    textSub: 'text-slate-300',
                    textSubLight: 'text-slate-300/70',
                    textHighlight: 'text-gray-300',
                    textCardTitle: 'text-gray-200',
                    borderMain: 'border-slate-500/30',
                    borderMainThin: 'border-slate-500/20',
                    borderFaint: 'border-slate-500/10',
                    borderHover: 'hover:border-gray-500/40',
                    focusRing: 'focus:ring-gray-500',
                    toggleActive: 'bg-gray-600 border-gray-400',
                    btnPrimary: 'from-slate-600 via-gray-600 to-zinc-600 hover:from-slate-500 hover:to-zinc-500 shadow-slate-900/50',
                    bgLight: 'bg-slate-900/40',
                    bgBadge: 'bg-slate-900 text-slate-300 border-slate-700/50',
                    btnAction: 'bg-slate-600/30 text-slate-200 hover:bg-slate-600/50 border-slate-500/30',
                    badgeInnate: 'bg-slate-600',
                    badgeInnateBonus: 'bg-gray-600',
                    badgeAcquired: 'bg-zinc-600',
                    badgeAcquiredBonus: 'bg-stone-600'
                }
            }
        };

        const TarotThumbnail = ({ cardNum, isOnline, tc }) => {
            const [error, setError] = useState(false);
            const card = TAROT_CARDS[cardNum];
            
            useEffect(() => { setError(false); }, [isOnline, cardNum]);

            if (!card) return null;

            if (isOnline && !error) {
                return (
                    <img 
                        src={`https://namdali-art.github.io/iristarot/images/majorcards/${cardNum}.jpg`}
                        alt={card.name}
                        onError={() => setError(true)}
                        className={`w-6 h-9 object-cover rounded shadow-sm mr-2 border ${tc.borderMain} flex-shrink-0 transition-colors`}
                    />
                );
            }
            return <span className="mr-2 text-lg flex-shrink-0">{card.icon}</span>;
        };

        const ResultCard = ({ title, dateLabel, dateObj, cardNum, badgeBg, isOnline, tc }) => {
            const card = TAROT_CARDS[cardNum] || TAROT_CARDS[0];
            const [imgError, setImgError] = useState(false);
            const imageUrl = `https://namdali-art.github.io/iristarot/images/majorcards/${cardNum}.jpg`;

            useEffect(() => {
                setImgError(false);
            }, [cardNum, isOnline]);

            return (
                <div className="tarot-card rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center relative overflow-hidden h-full">
                    <div className={`absolute top-0 left-0 w-full text-xs font-bold py-2 ${badgeBg} text-white tracking-wider shadow-lg uppercase transition-colors`}>
                        {title}
                    </div>
                    <div className={`mt-8 text-xs sm:text-sm font-medium mb-1 transition-colors ${tc.textSub}`}>{dateLabel} 기준</div>
                    <div className="text-base sm:text-lg font-bold mb-6 text-slate-100">{formatDate(dateObj)}</div>
                    
                    {isOnline && !imgError ? (
                        <img 
                            src={imageUrl} 
                            alt={card.name} 
                            onError={() => setImgError(true)}
                            className={`h-48 sm:h-56 mb-6 floating rounded-xl border object-contain tarot-img-shadow ${tc.borderMain}`}
                        />
                    ) : (
                        <div className="text-7xl sm:text-8xl mb-6 floating tarot-icon-shadow">
                            {card.icon}
                        </div>
                    )}
                    
                    <div className={`text-2xl sm:text-3xl font-bold tarot-title mb-3 drop-shadow transition-colors ${tc.textCardTitle}`}>
                        {cardNum}. {card.name.split('(')[0]}
                    </div>
                    <div className={`text-xs sm:text-sm mb-4 font-sans transition-colors ${tc.textSubLight}`}>
                        ({card.name.split('(')[1]}
                    </div>
                    <p className={`text-sm sm:text-base text-slate-200 italic leading-relaxed break-keep px-4 py-3.5 bg-slate-900/60 rounded-2xl w-full border shadow-inner transition-colors ${tc.borderMainThin}`}>
                        "{card.keyword}"
                    </p>
                </div>
            );
        };

        const App = () => {
            const [name, setName] = useState("");
            const [birthDate, setBirthDate] = useState("");
            const [inputType, setInputType] = useState("solar"); 
            const [activeTab, setActiveTab] = useState("calc"); 
            const [currentResult, setCurrentResult] = useState(null);
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [fontSize, setFontSize] = useState(() => safeStorage.get("tarotFontSize") || "normal");
            const [themeColor, setThemeColor] = useState(() => safeStorage.get("tarotTheme") || "purple");

            // 현재 선택된 테마의 스타일 구성 객체 가져오기
            const currentTheme = THEME_CONFIG[themeColor] || THEME_CONFIG.purple;
            const tc = currentTheme.c; // 단축 변수명 사용

            useEffect(() => {
                const root = document.documentElement;
                // 선택된 테마의 CSS 변수들을 HTML :root 요소에 동적으로 주입
                Object.entries(currentTheme.cssVars).forEach(([key, value]) => {
                    root.style.setProperty(key, value);
                });
                safeStorage.set('tarotTheme', themeColor);
            }, [themeColor, currentTheme]);

            useEffect(() => {
                if (fontSize === 'small') document.documentElement.style.fontSize = '14px';
                else if (fontSize === 'large') document.documentElement.style.fontSize = '18px';
                else document.documentElement.style.fontSize = '16px';
                safeStorage.set('tarotFontSize', fontSize);
            }, [fontSize]);

            useEffect(() => {
                const handleStatusChange = () => setIsOnline(navigator.onLine);
                window.addEventListener('online', handleStatusChange);
                window.addEventListener('offline', handleStatusChange);
                return () => {
                    window.removeEventListener('online', handleStatusChange);
                    window.removeEventListener('offline', handleStatusChange);
                };
            }, []);

            useEffect(() => {
                const savedHistory = safeStorage.get("tarotHistory_kasi_korlunar");
                if (savedHistory) {
                    try {
                        const parsed = JSON.parse(savedHistory);
                        if (Array.isArray(parsed)) setHistory(parsed);
                    } catch (e) {}
                }
            }, []);

            useEffect(() => {
                if (history.length > 0) {
                    safeStorage.set("tarotHistory_kasi_korlunar", JSON.stringify(history));
                }
            }, [history]);

            const handleExport = () => {
                if (history.length === 0) return alert("내보낼 데이터가 없습니다.");
                const dataStr = JSON.stringify(history, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `tarot_history_${new Date().toISOString().slice(0,10).replace(/-/g, '')}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (Array.isArray(importedData)) {
                            const existingIds = new Set(history.map(item => item.id));
                            const newHistory = [...history];
                            let addedCount = 0;
                            importedData.forEach(item => {
                                if (!existingIds.has(item.id)) { newHistory.push(item); addedCount++; }
                            });
                            newHistory.sort((a, b) => b.id - a.id);
                            setHistory(newHistory);
                            safeStorage.set("tarotHistory_kasi_korlunar", JSON.stringify(newHistory));
                            if (addedCount > 0) alert(`${addedCount}개의 새로운 기록을 성공적으로 불러왔습니다.`);
                            else alert("모든 기록이 이미 보관함에 존재합니다.");
                        } else alert("지원되지 않는 파일 형식입니다.");
                    } catch (error) { alert("파일을 읽는 중 오류가 발생했습니다."); }
                };
                reader.readAsText(file);
                e.target.value = ''; 
            };

            const handleClearAll = () => {
                if (history.length === 0) return;
                if (window.confirm("모든 기록을 영구적으로 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.")) {
                    setHistory([]);
                    safeStorage.set("tarotHistory_kasi_korlunar", "[]");
                    setCurrentResult(null);
                    alert("모든 기록이 삭제되었습니다.");
                }
            };

            const calculateTarotNumber = (y, m, d) => {
                const sum = y + m + d;
                const reduceNumber = (num) => num.toString().split('').reduce((acc, curr) => acc + parseInt(curr, 10), 0);
                let current = reduceNumber(sum);
                while (current > 21 && current !== 22) { current = reduceNumber(current); }
                return current === 22 ? 0 : current;
            };

            const calculateBonusCard = (y, m, d) => {
                const dateStr = `${y}${m.toString().padStart(2, '0')}${d.toString().padStart(2, '0')}`;
                let current = dateStr.split('').reduce((acc, curr) => acc + parseInt(curr, 10), 0);
                while (current >= 23) {
                    current = current.toString().split('').reduce((acc, curr) => acc + parseInt(curr, 10), 0);
                }
                return current === 22 ? 0 : current;
            };

            const handleCalculate = (e) => {
                e.preventDefault();
                if (!name.trim()) return alert("이름을 입력해주세요.");
                if (!birthDate) return alert("생년월일을 선택해주세요.");
                if (!window.korLunar) return alert("천문연구원 음양력 변환 모듈이 로드되지 않았습니다. 잠시 후 다시 시도해주세요.");

                setLoading(true);

                setTimeout(() => {
                    try {
                        const [year, month, day] = birthDate.split('-').map(Number);
                        let solarDate = {}, lunarDate = {};

                        if (inputType === 'solar') {
                            const lRes = window.korLunar.toLunar(year, month, day);
                            solarDate = { y: year, m: month, d: day };
                            lunarDate = { y: lRes.year, m: lRes.month, d: lRes.day, isLeap: lRes.isLeapMonth };
                        } else {
                            const sRes = window.korLunar.toSolar(year, month, day, false);
                            lunarDate = { y: year, m: month, d: day, isLeap: false };
                            solarDate = { y: sRes.year, m: sRes.month, d: sRes.day };
                        }

                        const innateCard = calculateTarotNumber(lunarDate.y, lunarDate.m, lunarDate.d);
                        const acquiredCard = calculateTarotNumber(solarDate.y, solarDate.m, solarDate.d);
                        const calculatedInnateBonus = calculateBonusCard(lunarDate.y, lunarDate.m, lunarDate.d);
                        const innateBonusCard = calculatedInnateBonus !== innateCard ? calculatedInnateBonus : null;
                        const calculatedAcquiredBonus = calculateBonusCard(solarDate.y, solarDate.m, solarDate.d);
                        const acquiredBonusCard = calculatedAcquiredBonus !== acquiredCard ? calculatedAcquiredBonus : null;

                        const resultData = {
                            id: Date.now(), name: name.trim(), inputDate: birthDate, inputType: inputType,
                            solar: solarDate, lunar: lunarDate,
                            innateCard, innateBonusCard, acquiredCard, acquiredBonusCard,
                            timestamp: new Date().toLocaleDateString()
                        };

                        setCurrentResult(resultData);
                        setHistory(prev => [resultData, ...prev.filter(item => item.name !== resultData.name || item.inputDate !== resultData.inputDate)]);
                        setLoading(false);

                        setTimeout(() => {
                            const resultArea = document.getElementById('result-area');
                            if (resultArea) resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 100);
                    } catch (error) {
                        setLoading(false);
                        alert("변환 지원 범위를 벗어났거나 유효하지 않은 날짜입니다. (지원 범위: 1890~2050년)");
                    }
                }, 300);
            };

            const handleDelete = (id) => {
                if(window.confirm("이 기록을 삭제하시겠습니까?")) {
                    const updated = history.filter(item => item.id !== id);
                    setHistory(updated);
                    safeStorage.set("tarotHistory_kasi_korlunar", JSON.stringify(updated));
                    if(currentResult && currentResult.id === id) setCurrentResult(null);
                }
            };

            return (
                <div className="min-h-[100dvh] p-4 sm:p-6 lg:p-8 flex justify-center items-start relative">
                    {!isOnline && (
                        <div className="fixed top-4 right-4 bg-red-500/90 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md border border-red-400 shadow-[0_0_15px_rgba(239,68,68,0.4)] z-50 flex items-center gap-1.5 animate-fade-in font-semibold tracking-wide">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path></svg>
                            오프라인
                        </div>
                    )}

                    <div className="w-full max-w-6xl flex flex-col gap-6 sm:gap-8 pb-16 mt-6 sm:mt-2 mx-auto">
                        <header className="text-center space-y-4 mt-4">
                            <div className="flex justify-center items-center w-full mb-2">
                                <img 
                                    src="https://healingtarot.co.kr/images/main/footlogo-new.png" 
                                    alt="이리스의 힐링타로 아카데미" 
                                    className="h-auto w-48 sm:w-64 md:w-80 object-contain drop-shadow-xl"
                                />
                            </div>
                            <h1 className={`text-3xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r ${tc.titleGrad} tracking-tight pb-1 transition-colors`}>
                                운명의 타로 생일수
                            </h1>
                            <p className="text-slate-300 text-xs sm:text-sm md:text-base max-w-lg mx-auto break-keep leading-relaxed font-light px-4">
                              도서 [이리스샘이 알려주는 타로카드의 공감 시크릿] 내용을 바탕으로 선천수와 후천수를 분석합니다.
                            </p>
                        </header>

                        <div className="flex justify-center gap-3 w-full max-w-sm mx-auto">
                            <button 
                                onClick={() => setActiveTab("calc")}
                                className={`flex-1 py-3 px-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm sm:text-base font-semibold shadow-lg ${activeTab === 'calc' ? `bg-gradient-to-r ${tc.tabActive} text-white scale-105` : 'bg-slate-800/80 text-slate-400 hover:bg-slate-700/80 border border-slate-700/50'}`}
                            >
                                🌟 생일수 계산
                            </button>
                            <button 
                                onClick={() => setActiveTab("history")}
                                className={`flex-1 py-3 px-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm sm:text-base font-semibold shadow-lg ${activeTab === 'history' ? `bg-gradient-to-r ${tc.tabActive} text-white scale-105` : 'bg-slate-800/80 text-slate-400 hover:bg-slate-700/80 border border-slate-700/50'}`}
                            >
                                📜 보관함 {history.length > 0 && <span className="bg-slate-100 text-slate-800 text-xs px-2 py-0.5 rounded-full ml-1 font-bold">{history.length}</span>}
                            </button>
                        </div>

                        <main className="w-full flex flex-col items-center">
                            {}
                            {activeTab === 'calc' && (
                                <div className="w-full max-w-xl animate-fade-in space-y-8">
                                    <div className="glass-panel rounded-3xl p-6 sm:p-10 w-full">
                                        <form onSubmit={handleCalculate} className="space-y-6">
                                            <div className="space-y-2">
                                                <label className={`text-sm font-semibold flex items-center gap-2 ml-1 transition-colors ${tc.textMain}`}>
                                                    ✨ 이름 (또는 닉네임)
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={name}
                                                    onChange={(e) => setName(e.target.value)}
                                                    className={`w-full bg-slate-900/80 border ${tc.borderMain} rounded-2xl px-5 py-4 text-white text-base focus:outline-none focus:ring-2 ${tc.focusRing} transition-all placeholder:text-slate-500 shadow-inner`}
                                                    placeholder="성함을 입력해주세요"
                                                />
                                            </div>
                                            
                                            <div className="space-y-2">
                                                <label className={`text-sm font-semibold flex items-center gap-2 ml-1 transition-colors ${tc.textMain}`}>
                                                    📅 생년월일 선택 (1890~2050년)
                                                </label>
                                                <input 
                                                    type="date" 
                                                    value={birthDate}
                                                    onChange={(e) => setBirthDate(e.target.value)}
                                                    min="1890-01-01"
                                                    max="2050-12-31"
                                                    className={`w-full bg-slate-900/80 border ${tc.borderMain} rounded-2xl px-5 py-4 text-white text-base focus:outline-none focus:ring-2 ${tc.focusRing} transition-all cursor-pointer shadow-inner`}
                                                />
                                            </div>

                                            <div className="space-y-2">
                                                <label className={`text-sm font-semibold flex items-center gap-2 ml-1 transition-colors ${tc.textMain}`}>
                                                    🔄 입력한 생년월일의 역법 종류
                                                </label>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <button 
                                                        type="button"
                                                        onClick={() => setInputType('solar')}
                                                        className={`py-3 px-4 rounded-xl text-sm font-semibold transition-all border ${inputType === 'solar' ? `${tc.toggleActive} text-white shadow-lg` : `bg-slate-900/50 ${tc.toggleInactive} text-slate-400 hover:text-white`}`}
                                                    >
                                                        ☀️ 양력 (Solar)
                                                    </button>
                                                    <button 
                                                        type="button"
                                                        onClick={() => setInputType('lunar')}
                                                        className={`py-3 px-4 rounded-xl text-sm font-semibold transition-all border ${inputType === 'lunar' ? `${tc.toggleActive} text-white shadow-lg` : `bg-slate-900/50 ${tc.toggleInactive} text-slate-400 hover:text-white`}`}
                                                    >
                                                        🌙 음력 (Lunar)
                                                    </button>
                                                </div>
                                            </div>

                                            <button 
                                                type="submit"
                                                disabled={loading}
                                                className={`w-full bg-gradient-to-r ${tc.btnPrimary} text-white font-bold py-4 px-6 rounded-2xl shadow-xl transform transition-all active:scale-[0.98] flex items-center justify-center gap-2 mt-4 text-base sm:text-lg tracking-wide disabled:opacity-50`}
                                            >
                                                {loading ? (
                                                    <span className="flex items-center gap-2">
                                                        <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                                        </svg>
                                                        정밀 천문 역법 변환 중...
                                                    </span>
                                                ) : (
                                                    <>🔮 운명의 타로카드 뽑기</>
                                                )}
                                            </button>
                                        </form>
                                    </div>

                                    {}
                                    {currentResult && (
                                        <div id="result-area" className="space-y-6 animate-fade-in w-full max-w-5xl mx-auto pt-4 pb-12">
                                            <div className={`text-center ${tc.bgLight} rounded-2xl p-5 border ${tc.borderMain} backdrop-blur-md shadow-xl transition-colors`}>
                                                <h2 className={`text-xl sm:text-2xl font-bold break-keep transition-colors ${tc.textMain}`}>
                                                    ✨ <span className={`underline underline-offset-4 ${tc.textHighlight}`}>{currentResult.name}</span> 님의 운명 레포트
                                                </h2>
                                                <p className={`text-xs mt-1 transition-colors ${tc.textSubLight}`}>
                                                    입력 기준: {currentResult.inputType === 'solar' ? '양력' : '음력'} ({currentResult.inputDate})
                                                </p>
                                            </div>
                                            
                                            <div className="grid grid-cols-1 gap-6 w-full max-w-md mx-auto">
                                                <ResultCard 
                                                    title="선천수 (음력: 내면의 자아)"
                                                    dateLabel="변환된 음력"
                                                    dateObj={currentResult.lunar}
                                                    cardNum={currentResult.innateCard}
                                                    badgeBg={tc.badgeInnate}
                                                    isOnline={isOnline}
                                                    tc={tc}
                                                />
                                                {currentResult.innateBonusCard != null && (
                                                    <ResultCard 
                                                        title="선천수 보너스 (숨겨진 본성)"
                                                        dateLabel="음력 기준"
                                                        dateObj={currentResult.lunar}
                                                        cardNum={currentResult.innateBonusCard}
                                                        badgeBg={tc.badgeInnateBonus}
                                                        isOnline={isOnline}
                                                        tc={tc}
                                                    />
                                                )}
                                                <ResultCard 
                                                    title="후천수 (양력: 사회적 성향)"
                                                    dateLabel="변환된 양력"
                                                    dateObj={currentResult.solar}
                                                    cardNum={currentResult.acquiredCard}
                                                    badgeBg={tc.badgeAcquired}
                                                    isOnline={isOnline}
                                                    tc={tc}
                                                />
                                                {(currentResult.acquiredBonusCard != null || currentResult.bonusCard != null) && (
                                                    <ResultCard 
                                                        title="후천수 보너스 (잠재된 능력)"
                                                        dateLabel="양력 기준"
                                                        dateObj={currentResult.solar}
                                                        cardNum={currentResult.acquiredBonusCard != null ? currentResult.acquiredBonusCard : currentResult.bonusCard}
                                                        badgeBg={tc.badgeAcquiredBonus}
                                                        isOnline={isOnline}
                                                        tc={tc}
                                                    />
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {}
                            {activeTab === 'history' && (
                                <div className="glass-panel rounded-3xl p-4 sm:p-8 w-full max-w-4xl animate-fade-in mx-auto">
                                    <div className={`flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 mb-6 border-b ${tc.borderMainThin} transition-colors`}>
                                        <h2 className={`text-xl sm:text-2xl font-bold flex items-center gap-2 transition-colors ${tc.textMain}`}>
                                            📜 저장된 운명의 기록
                                        </h2>
                                        
                                        <div className="flex flex-wrap sm:flex-nowrap gap-2">
                                            <input type="file" accept=".json" id="import-file" className="hidden" onChange={handleImport} />
                                            
                                            <button 
                                                onClick={() => document.getElementById('import-file').click()} 
                                                className="flex-1 sm:flex-none text-xs sm:text-sm py-2 px-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 border border-slate-600 transition-colors flex items-center justify-center gap-1.5 shadow-md"
                                                title="저장된 JSON 데이터를 불러옵니다"
                                            >
                                                <span>📂 불러오기</span>
                                            </button>
                                            <button 
                                                onClick={handleExport} 
                                                className="flex-1 sm:flex-none text-xs sm:text-sm py-2 px-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 border border-slate-600 transition-colors flex items-center justify-center gap-1.5 shadow-md"
                                                title="현재 기록을 JSON 파일로 다운로드합니다"
                                            >
                                                <span>💾 내보내기</span>
                                            </button>
                                            <button 
                                                onClick={handleClearAll} 
                                                className="flex-1 sm:flex-none text-xs sm:text-sm py-2 px-3 bg-red-900/40 hover:bg-red-800/60 rounded-xl text-red-300 border border-red-800/50 transition-colors flex items-center justify-center gap-1.5 shadow-md"
                                            >
                                                <span>🗑️ 일괄삭제</span>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {history.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center py-20 text-slate-400 gap-3">
                                            <span className="text-4xl opacity-40">🌙</span>
                                            <p className="text-sm sm:text-base">아직 저장된 기록이 없습니다.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-4 max-h-[65vh] overflow-y-auto pr-2 hide-scrollbar">
                                            {history.map((record) => (
                                                <div key={record.id} className={`bg-slate-900/80 border ${tc.borderMainThin} rounded-2xl p-5 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between transition-all ${tc.borderHover} group shadow-lg`}>
                                                    
                                                    <div className="flex-1 w-full overflow-hidden">
                                                        <div className="flex items-center justify-between sm:justify-start gap-3 mb-3">
                                                            <h3 className="text-lg font-bold text-white truncate">{record.name}</h3>
                                                            <span className={`text-xs font-medium px-2.5 py-1 rounded-full border whitespace-nowrap transition-colors ${tc.bgBadge}`}>
                                                                {record.inputDate} ({record.inputType === 'solar' ? '양력' : '음력'})
                                                            </span>
                                                        </div>
                                                        <div className={`grid ${[record.innateBonusCard, record.acquiredBonusCard != null ? record.acquiredBonusCard : record.bonusCard].filter(x => x != null).length === 2 ? 'grid-cols-2 sm:grid-cols-4' : [record.innateBonusCard, record.acquiredBonusCard != null ? record.acquiredBonusCard : record.bonusCard].filter(x => x != null).length === 1 ? 'grid-cols-2 sm:grid-cols-3' : 'grid-cols-2'} gap-2 sm:gap-3 text-sm`}>
                                                            <div className={`p-2 sm:p-2.5 rounded-xl border overflow-hidden transition-colors ${tc.bgLight} ${tc.borderFaint}`}>
                                                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 block mb-1">선천수</span>
                                                                <span className="text-slate-200 font-medium flex items-center truncate">
                                                                    <TarotThumbnail cardNum={record.innateCard} isOnline={isOnline} tc={tc} />
                                                                    <span className="truncate">{record.innateCard}. {TAROT_CARDS[record.innateCard]?.name.split('(')[0]}</span>
                                                                </span>
                                                            </div>
                                                            {record.innateBonusCard != null && (
                                                                <div className={`p-2 sm:p-2.5 rounded-xl border overflow-hidden transition-colors ${tc.bgLight} ${tc.borderFaint}`}>
                                                                    <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 block mb-1">선천수 보너스</span>
                                                                    <span className="text-slate-200 font-medium flex items-center truncate">
                                                                        <TarotThumbnail cardNum={record.innateBonusCard} isOnline={isOnline} tc={tc} />
                                                                        <span className="truncate">{record.innateBonusCard}. {TAROT_CARDS[record.innateBonusCard]?.name.split('(')[0]}</span>
                                                                    </span>
                                                                </div>
                                                            )}
                                                            <div className={`p-2 sm:p-2.5 rounded-xl border overflow-hidden transition-colors ${tc.bgLight} ${tc.borderFaint}`}>
                                                                <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 block mb-1">후천수</span>
                                                                <span className="text-slate-200 font-medium flex items-center truncate">
                                                                    <TarotThumbnail cardNum={record.acquiredCard} isOnline={isOnline} tc={tc} />
                                                                    <span className="truncate">{record.acquiredCard}. {TAROT_CARDS[record.acquiredCard]?.name.split('(')[0]}</span>
                                                                </span>
                                                            </div>
                                                            {(record.acquiredBonusCard != null || record.bonusCard != null) && (
                                                                <div className={`p-2 sm:p-2.5 rounded-xl border overflow-hidden transition-colors ${tc.bgLight} ${tc.borderFaint}`}>
                                                                    <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 block mb-1">후천수 보너스</span>
                                                                    <span className="text-slate-200 font-medium flex items-center truncate">
                                                                        <TarotThumbnail cardNum={record.acquiredBonusCard != null ? record.acquiredBonusCard : record.bonusCard} isOnline={isOnline} tc={tc} />
                                                                        <span className="truncate">{(record.acquiredBonusCard != null ? record.acquiredBonusCard : record.bonusCard)}. {TAROT_CARDS[record.acquiredBonusCard != null ? record.acquiredBonusCard : record.bonusCard]?.name.split('(')[0]}</span>
                                                                    </span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>

                                                    <div className={`flex gap-2 w-full sm:w-auto justify-end border-t pt-3 sm:border-none sm:pt-0 transition-colors ${tc.borderFaint}`}>
                                                        <button 
                                                            onClick={() => {
                                                                setCurrentResult(record);
                                                                setActiveTab('calc');
                                                                window.scrollTo({ top: 0, behavior: 'smooth' });
                                                            }}
                                                            className={`flex-1 sm:flex-none py-2 px-4 rounded-xl transition-colors text-sm font-medium border whitespace-nowrap ${tc.btnAction}`}
                                                        >
                                                            다시보기
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDelete(record.id)}
                                                            className="py-2 px-3 bg-red-500/20 text-red-300 rounded-xl hover:bg-red-500/40 transition-colors text-sm border border-red-500/30 whitespace-nowrap"
                                                        >
                                                            삭제
                                                        </button>
                                                    </div>

                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}
                        </main>
                        
                        {}
                        <footer className="text-center text-xs text-slate-400/60 mt-12 space-y-4 font-light relative pb-10">
                            <p>한국천문연구원 양음력 변환 사용으로 정확도를 높였습니다.</p>
                            
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="inline-flex items-center gap-1.5 px-4 py-2 bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 rounded-full transition-colors border border-slate-600 shadow-md"
                            >
                                ⚙️ 환경설정
                            </button>
                        </footer>

                        {isSettingsOpen && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => setIsSettingsOpen(false)}>
                                <div className="glass-panel rounded-2xl p-6 sm:p-8 w-full max-w-sm flex flex-col gap-6" onClick={e => e.stopPropagation()}>
                                    <div className="flex justify-between items-center border-b border-white/10 pb-3">
                                        <h3 className="text-lg font-bold text-white flex items-center gap-2">⚙️ 환경설정</h3>
                                        <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
                                    </div>
                                    
                                    <div className="space-y-3">
                                        <label className={`text-sm font-semibold transition-colors ${tc.textMain}`}>글자 크기</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['small', 'normal', 'large'].map(size => (
                                                <button
                                                    key={size}
                                                    onClick={() => setFontSize(size)}
                                                    className={`py-2 px-1 rounded-xl text-xs sm:text-sm transition-all border ${fontSize === size ? `${tc.toggleActive} text-white shadow-lg` : 'bg-slate-800 border-slate-600 text-slate-400 hover:text-white'}`}
                                                >
                                                    {size === 'small' ? '작게' : size === 'normal' ? '보통' : '크게'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <label className={`text-sm font-semibold transition-colors ${tc.textMain}`}>배경 테마</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'purple', name: '보라 (기본)', bg: 'bg-purple-600' },
                                                { id: 'blue', name: '파랑 (바다)', bg: 'bg-sky-600' },
                                                { id: 'green', name: '초록 (자연)', bg: 'bg-emerald-600' },
                                                { id: 'rose', name: '장미 (열정)', bg: 'bg-rose-600' },
                                                { id: 'gold', name: '황금 (풍요)', bg: 'bg-amber-500' },
                                                { id: 'sunset', name: '노을 (황혼)', bg: 'bg-orange-500' },
                                                { id: 'galaxy', name: '은하 (신비)', bg: 'bg-fuchsia-600' },
                                                { id: 'monochrome', name: '실버 (차분)', bg: 'bg-slate-500' }
                                            ].map(theme => (
                                                <button
                                                    key={theme.id}
                                                    onClick={() => setThemeColor(theme.id)}
                                                    className={`py-2 px-3 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-2 transition-all border ${themeColor === theme.id ? 'bg-slate-700 border-white text-white shadow-lg' : 'bg-slate-800 border-slate-600 text-slate-400 hover:text-white'}`}
                                                >
                                                    <span className={`w-3 h-3 rounded-full ${theme.bg}`}></span>
                                                    {theme.name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="w-full mt-2 py-3 bg-white/10 hover:bg-white/20 rounded-xl text-white font-semibold transition-colors"
                                    >
                                        닫기
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
